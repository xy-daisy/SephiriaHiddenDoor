## Settings file was created by plugin Sephiria Hidden Door Highlight v1.0.1
## Plugin GUID: com.sephiria.hiddendoor

[Appearance]

## How many art pixels one world unit is drawn with. This is what makes the highlight look like pixel art: 12 means each block of the frame is 1/12 of a tile. Lower = chunkier blocks, higher = finer.
# Setting type: Single
# Default value: 12
PixelsPerUnit = 12

## Thickness of the frame, in art pixels.
# Setting type: Int32
# Default value: 2
BorderThickness = 2

## How far the solid corner brackets reach along each edge, in art pixels. The corners stay solid while the dashes between them move, so the frame always reads as a rectangle.
# Setting type: Int32
# Default value: 8
CornerLength = 8

## Length of the dash pattern in art pixels. The animation has exactly this many frames, stepping the diagonal stripes by one pixel each time.
# Setting type: Int32
# Default value: 4
DashPeriod = 4

## How many times per second the dash pattern advances. 8 is a deliberately chunky, 8-bit-looking speed.
# Setting type: Single
# Default value: 8
AnimationFps = 8

## World units added around the object before the frame is drawn, so the frame does not sit exactly on the sprite edge.
# Setting type: Single
# Default value: 0.12
Padding = 0.12

## Draw a 1-pixel dark outline around the frame and the icon. This is what keeps a bright frame readable on a bright wall.
# Setting type: Boolean
# Default value: true
Outline = true

## Colour of that outline, as RRGGBB.
# Setting type: String
# Default value: 0A0A12
OutlineColor = 0A0A12

## Draw the pixel "!" above the frame. Off by default: with the frame sitting
##  on the wall itself the mark was the loudest thing on screen.
# Setting type: Boolean
# Default value: false
Icon = false

## Size multiplier for the "!" icon.
# Setting type: Single
# Default value: 1
IconScale = 1

## Gap between the top of the frame and the bottom of the icon, in world units.
# Setting type: Single
# Default value: 0.15
IconGap = 0.15

## Force the highlight onto this sorting layer. Copying the marked object's layer
##  was not enough: terrain drawn on a later layer (roof, cliff faces) covered parts
##  of the frame, and layer priority beats any sorting order. "FX" draws above the
##  world layers but below UI. Empty = copy the object's layer (old behaviour).
# Setting type: String
# Default value: FX
SortingLayerName = FX

## Sorting order used when there is no object to copy one from (the corridor trigger has no renderer at all). High enough to sit above the tilemap.
# Setting type: Int32
# Default value: 30000
SortingOrder = 30000

## Added to the marked object's own sorting order. High enough that the frame is drawn on top of the wall it belongs to.
# Setting type: Int32
# Default value: 30000
SortingOrderOffset = 30000

[Colors]

## Colour for walls that open a corridor, as RRGGBB.
# Setting type: String
# Default value: FFD23F
CorridorColor = FFD23F

## Colour for walls that become a teleport portal, as RRGGBB.
# Setting type: String
# Default value: 4FD6FF
PortalColor = 4FD6FF

## Colour for C5CrackProp, as RRGGBB.
# Setting type: String
# Default value: FF6B6B
CrackColor = FF6B6B

[General]

## Master switch. On by default, so the mod works the moment it is installed. Set this to false in the config file to turn the highlighting off entirely.
# Setting type: Boolean
# Default value: true
Enabled = true

## How often the scene is swept for hidden doors, in seconds. They only appear when the floor is generated, so this only has to be fast enough that a newly built floor gets marked promptly.
# Setting type: Single
# Default value: 0.5
ScanIntervalSeconds = 0.5

## Only highlight doors within this many world units of the player. 0 = no limit (every hidden door on the floor is marked, including ones in rooms you have not reached yet). One room is roughly 26 x 18 units.
# Setting type: Single
# Default value: 0
MaxDistance = 0

## Show one in-game notice the first time you are in town after starting the game, so you can tell the mod is actually running. Printed through the game's own system-message element, in the game's own message slot.
# Setting type: Boolean
# Default value: true
ShowNotice = true

## How often to log a one-line status summary. 0 disables the heartbeat.
# Setting type: Single
# Default value: 0
HeartbeatSeconds = 0

## Noisy per-object logging. For troubleshooting only.
# Setting type: Boolean
# Default value: false
DebugLog = false

[Passage]

## When a corridor wall is broken, log the tiles, the colliders and the player's collider size around the doorway. Read-only: it changes nothing. This is how an "I opened it but cannot walk through" report gets diagnosed.
# Setting type: Boolean
# Default value: false
ProbeAfterOpening = false

[Targets]

## Mark HiddenRoomTriggerCollider - the invisible wall that, once broken, digs a corridor through to the hidden room. Needs melee hits (DirectAttack only), 50 hp, damage under 20 is raised to 20, so three hits open it.
# Setting type: Boolean
# Default value: true
HighlightCorridorWalls = true

## Mark BreakableProp_HiddenPortal entrances - the wall that becomes a teleport portal once broken. Only the Entrance side is marked; the Exit side inside the hidden room cannot be broken and is not a target.
# Setting type: Boolean
# Default value: true
HighlightPortalWalls = true

## Mark C5CrackProp - the chapter-5 story cracks. These are quest props rather than hidden-area entrances, so this is off by default.
# Setting type: Boolean
# Default value: false
HighlightCrackProps = false

## Corridor hidden walls have no renderer, and their trigger is spawned one tile
##  beyond the wall, so drawing the frame on the trigger box puts it on the floor
##  in front of the wall. With this on, the mod asks the tilemap which cells are
##  actually wall and traces the OUTLINE of those tiles, so the highlight follows
##  irregular wall shapes instead of boxing the whole area. Read-only. If no wall
##  tile can be found it falls back to the trigger box rectangle.
# Setting type: Boolean
# Default value: true
FitCorridorFrameToWall = true

